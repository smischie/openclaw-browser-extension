<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenClaw</title>
<!-- Browser side panel title is set via chrome.sidePanel API -->
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <label class="follow-toggle" id="followToggleLabel" title="Follow mode: auto-attach current tab">
          <input type="checkbox" id="followToggle">
          <span class="follow-slider">
            <span class="follow-eye-icon off">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </span>
            <span class="follow-eye-icon on">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
          </span>
        </label>
        <button class="action-btn" id="btnSnapshot" title="Share current tab (screenshot + content)" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--bg-hover); border: 1px solid var(--border); cursor: pointer; margin-left: 4px; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M3 9h2M19 9h2"/>
          </svg>
        </button>
        <img class="header-avatar" src="icons/assistant-avatar-64.png" alt="" id="headerAvatar">
        <div class="tab-stats" id="tabStats" title="Open tabs · groups">
          <span id="tabStatsText">—</span>
        </div>
      </div>
      <div class="header-right">
        <div class="header-tools">
          <button class="action-btn" id="btnDashboard" title="Open Dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="11" rx="8" ry="7"/><path d="M12 18c0 2-2 3.5-4 3 1-1 1.5-2 1.5-3"/><path d="M12 18c0 2 2 3.5 4 3-1-1-1.5-2-1.5-3"/><ellipse cx="9" cy="10" rx="1.5" ry="2" fill="currentColor" opacity="0.3"/><ellipse cx="15" cy="10" rx="1.5" ry="2" fill="currentColor" opacity="0.3"/><path d="M8 14c1.5 1.5 6.5 1.5 8 0" stroke-linecap="round" opacity="0.4"/></svg>
          </button>
          <button class="action-btn" id="btnSettings" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </button>
        </div>
        <div class="theme-toggles">
          <button class="theme-btn active" data-theme="dark" title="Dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="theme-btn" data-theme="light" title="Light">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="theme-btn" data-theme="system" title="System">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="tabs-panel" id="tabsPanel" style="display:none"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" rows="3" placeholder="Message (Enter to send)" disabled></textarea>
      <div class="input-actions">
        <input class="file-input" id="fileInput" type="file" disabled
          accept=".txt,.md,.pdf,.png,.jpg,.jpeg,.webp,.gif,.csv,.json,.log,.zip,.tar,.gz" />
        <button class="input-action-btn" id="attachBtn" disabled title="Attach">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-8.49 8.49a6 6 0 0 1-8.49-8.49l9.9-9.9a4 4 0 0 1 5.66 5.66l-9.9 9.9a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="input-action-btn" id="downloadBtn" title="Download chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button class="input-action-btn" id="micBtn" title="Voice input">
          <svg class="mic-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <svg class="recording-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <circle cx="12" cy="12" r="8"/>
          </svg>
          <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </button>
        <button class="input-action-btn" id="emojiBtn" title="Insert emoji">
          <span style="font-size: 16px; line-height: 1;">😊</span>
        </button>
        <button class="input-action-btn send" id="sendBtn" disabled title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="typing" id="typing" style="display:none">
    <span>●</span><span>●</span><span>●</span> Thinking...
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="emoji">🗿⚡</div>
      <p>Connecting...</p>
    </div>
  </div>
</div>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
